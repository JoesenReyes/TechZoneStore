<!-- HEADER -->
<header>

    <!-- MOBILE BURGER -->
    <button
        id="menuToggle"
        class="menu-toggle"
        onclick="toggleMobileMenu()"
        aria-label="Open Menu"
    >
        ☰
    </button>

    <div class="brand-header">
        <span class="mini-logo">TZ</span>
        <span>TechZone Store</span>
    </div>

    <div class="header-right">
        <span id="currentUser"></span>
        <span id="roleBadge" class="role-badge"></span>

        <button
            class="logout-btn"
            onclick="confirmLogout()"
        >
            Logout
        </button>
    </div>

</header>


<!-- DASHBOARD -->
<div class="dashboard-layout">

    <aside id="sidebar">

        <!-- imong existing sidebar buttons diri -->
        <!-- AYAW TANGTANGA -->

        <button onclick="showSection('dashboard')">
            🏠 Dashboard
        </button>

        <button onclick="showSection('products')">
            📦 Products
        </button>

        <button onclick="showSection('categories')">
            🗂️ Categories
        </button>

        <button onclick="showSection('customers')">
            👥 Customers
        </button>

        <button onclick="showSection('deleted')">
            🗑️ Deleted Products
        </button>

        <button onclick="showSection('users')">
            👤 Users
        </button>

        <button onclick="showSection('activity')">
            📋 Activity Logs
        </button>

        <button onclick="showSection('reports')">
            📊 Reports
        </button>

    </aside>


    <!-- MOBILE DARK OVERLAY -->
    <div
        id="menuOverlay"
        class="menu-overlay"
        onclick="closeMobileMenu()"
    ></div>


    <main>

        <!-- Diri magpabilin ang TANAN nimong existing sections -->

    </main>

</div>
